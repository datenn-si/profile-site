name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-slim

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env file
        run: |
          umask 077
          printf 'EMAIL_ADDRESS=%s\n' "$EMAIL_ADDRESS" > .env
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}

      - name: Build
        id: build
        run: pnpm build

      - name: Remove .env file
        if: ${{ always() }}
        run: rm -f .env

      - name: Deploy to Cloudflare Workers
        id: deploy
        run: pnpm deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Write job summary
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          DEPLOY_RESULT: ${{ steps.deploy.outcome }}
          SITE_URL: https://datenn.si/
        run: |
          status_icon() {
            case "$1" in
              success)   echo "✅ Success" ;;
              failure)   echo "❌ Failure" ;;
              cancelled) echo "⚪ Cancelled" ;;
              skipped)   echo "⏭️ Skipped" ;;
            esac
          }

          {
            echo "## Deploy Summary"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Astro build | $(status_icon "${BUILD_RESULT:-}") |"
            echo "| Cloudflare deploy | $(status_icon "${DEPLOY_RESULT:-}") |"
            echo ""
            if [[ "$DEPLOY_RESULT" == "success" ]]; then
              echo "### Production"
              echo ""
              echo "[${SITE_URL}](${SITE_URL})"
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"
