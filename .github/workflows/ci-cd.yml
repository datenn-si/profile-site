name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: CI/CD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        id: lint
        run: pnpm lint

      - name: Format Check
        id: format
        run: pnpm fmt:check

      - name: Build
        id: build
        run: pnpm build
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}

      - name: Deploy to Cloudflare Workers
        id: deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Write job summary
        if: always()
        env:
          LINT_RESULT: ${{ steps.lint.outcome }}
          FORMAT_RESULT: ${{ steps.format.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          DEPLOY_RESULT: ${{ steps.deploy.outcome }}
          SITE_URL: https://datenn.si
        run: |
          status_icon() {
            case "$1" in
              success)   echo "✅ Success" ;;
              failure)   echo "❌ Failure" ;;
              cancelled) echo "⚪ Cancelled" ;;
              skipped)   echo "⏭️ Skipped" ;;
            esac
          }

          {
            echo "## CI / Deployment Summary"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Oxlint | $(status_icon "${LINT_RESULT:-}") |"
            echo "| Oxfmt | $(status_icon "${FORMAT_RESULT:-}") |"
            echo "| Astro build | $(status_icon "${BUILD_RESULT:-}") |"
            echo "| Cloudflare deploy | $(status_icon "${DEPLOY_RESULT:-}") |"
            echo ""
            if [[ "$EVENT_NAME" == "push" && "$DEPLOY_RESULT" == "success" ]]; then
              echo "### Production"
              echo ""
              echo "[${SITE_URL}](${SITE_URL})"
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"
